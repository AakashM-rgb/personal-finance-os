# Exact versions of every runtime dependency, used as a pip *constraints* file
# so that what CI tests is what Render installs (pyproject.toml has only lower
# bounds, and a fresh `pip install .` would otherwise pick whatever is newest
# on the day of the deploy).
#
#   CI:      pip install -c requirements.lock -e ".[dev]"
#   Render:  pip install -c requirements.lock .
#
# Regenerate after changing dependencies in pyproject.toml, then run the full
# test suite and pip-audit before committing:
#   uv pip compile pyproject.toml --universal --python-version 3.13 --no-header -o requirements.lock
# (then re-add this header). Universal: the markers cover Linux (Render, CI)
# and Windows (local development). Resolved for Python 3.13, the only version
# the project supports (pyproject.toml requires-python, backend/.python-version):
# some pins, e.g. deprecated 3.x, don't install on 3.11.
